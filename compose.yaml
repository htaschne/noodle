services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  monitoring:
    build:
      context: ./monitoring
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
    command:
      - /bin/sh
      - -ec
      - |
        compose_url="$$(printf '%s' "$$RABBITMQ_URL" | sed -E 's#^amqps?://(([^/@]+)@)?[^/?]+(:[0-9]+)?(.*)$$#amqp://\1rabbitmq:5672\4#')"
        case "$$compose_url" in
          amqp://*@rabbitmq:5672*) ;;
          *) echo "RABBITMQ_URL must be a complete authenticated AMQP URL" >&2; exit 1 ;;
        esac
        export RABBITMQ_URL="$$compose_url"
        exec ./monitoring
    depends_on:
      rabbitmq:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  notifications:
    build:
      context: ./notifications
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATIONS_DB_PATH: /data/notifications.db
    volumes:
      - notifications_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    stop_grace_period: 30s

volumes:
  rabbitmq_data:
  notifications_data:
